static_resources:
  listeners:
  - name: ai_gateway_ingress
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: ai_ingress
          use_remote_address: true
          route_config:
            name: local_ai_route
            virtual_hosts:
            - name: ai_service
              domains: ["*"]
              routes:
              - match:
                  prefix: "/health"
                route:
                  cluster: backend_service
              - match:
                  prefix: "/v1/routes"
                route:
                  cluster: backend_service
                  timeout: 120s
              - match:
                  prefix: "/v1/chat/completions"
                route:
                  cluster: backend_service
                  timeout: 120s
              - match:
                  prefix: "/v1/models"
                route:
                  cluster: backend_service
                  timeout: 30s
              - match:
                  prefix: "/api/v1/agent-router"
                route:
                  cluster: backend_service
                  timeout: 30s
              - match:
                  prefix: "/api/v1/ext-proc"
                route:
                  cluster: backend_service
                  timeout: 10s
              - match:
                  prefix: "/v1"
                route:
                  cluster: backend_service
                  timeout: 120s
          http_filters:
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  - name: backend_service
    type: STRICT_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: backend_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: backend
                port_value: 8000

  - name: vllm_fast_8b
    type: STRICT_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: LEAST_REQUEST
    load_assignment:
      cluster_name: vllm_fast_8b
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: backend
                port_value: 8000

  - name: vllm_reasoning_72b
    type: STRICT_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: LEAST_REQUEST
    load_assignment:
      cluster_name: vllm_reasoning_72b
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: backend
                port_value: 8000

  - name: vllm_inference_pool
    type: STRICT_DNS
    lb_policy: LEAST_REQUEST
    load_assignment:
      cluster_name: vllm_inference_pool
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: 127.0.0.1
                port_value: 8000

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
