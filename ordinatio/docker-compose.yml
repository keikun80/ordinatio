services:
  # 1. 메타스토어: PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: ordinatio-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ordinatio_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ordinatio_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. 분산 쿼터 및 Rate Limit 캐시: Redis
  redis:
    image: redis:7-alpine
    container_name: ordinatio-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. L7 Ingress: Envoy AI Gateway
  envoy:
    image: envoyproxy/envoy:v1.31.2
    container_name: ordinatio-envoy
    volumes:
      - ./deploy/envoy/envoy.yaml:/etc/envoy/envoy.yaml
    ports:
      - "${ENVOY_TRAFFIC_PORT:-8080}:8080" # L7 Traffic Ingress
      - "${ENVOY_ADMIN_PORT:-9901}:9901" # Envoy Admin & Prometheus Stats
    command: ["/usr/local/bin/envoy", "-c", "/etc/envoy/envoy.yaml"]

  # 4. 컨트롤 플레인 백엔드 API (FastAPI - 로컬 개발 영역 실시간 연동)
  backend:
    image: ordinatio-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ordinatio-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ordinatio_db}
      REDIS_HOST: ${REDIS_HOST:-redis}
      ENVOY_ADMIN_URL: ${ENVOY_ADMIN_URL:-http://envoy:9901}
      DATACENTER_NAME: ${DATACENTER_NAME:-온프레미스 주전산센터}
      CLUSTER_REGION: ${CLUSTER_REGION:-DC-1 서울}
      DEPLOY_MODE: ${DEPLOY_MODE:-air-gap}
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 5. 어드민 포털 프론트엔드 (React 18 + Vite HMR - 로컬 개발 영역 실시간 연동)
  frontend:
    image: ordinatio-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: ordinatio-frontend
    env_file:
      - .env
    environment:
      VITE_BACKEND_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.js:/app/vite.config.js
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5173/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
