# Production / Appliance Override Configuration
# Usage:
#   make prod-build   (or: docker compose -f docker-compose.yml -f docker-compose.prod.yml build)
#   make prod-up      (or: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build)

services:
  backend:
    image: aiorche-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes: !reset []
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    image: aiorche-frontend:prod
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: prod
    volumes: !reset []
    ports: !override
      - "${FRONTEND_PORT:-5173}:80"
    healthcheck: !override
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    command: ["nginx", "-g", "daemon off;"]
