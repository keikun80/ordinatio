# ==============================================================================
# AI Orchestrator Standalone Mode Docker Compose Specification
# Single-Host Self-Contained Appliance Architecture (Enterprise Linux 9)
# ==============================================================================

version: "3.8"

networks:
  aiorche-net:
    name: aiorche-net
    driver: bridge

services:
  # ----------------------------------------------------------------------------
  # 1. Metastore: PostgreSQL 15
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: aiorche-postgres
    restart: always
    networks:
      - aiorche-net
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aiorche_db}
    ports:
      # 로컬 루프백 전용 바인딩 (외부 노출 차단)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
      - ./data/postgres:/var/lib/postgresql/data:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aiorche_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Quota & Distributed Cache: Redis 7
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: aiorche-redis
    restart: always
    networks:
      - aiorche-net
    ports:
      # 로컬 루프백 전용 바인딩 (외부 노출 차단)
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data:z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 3. L7 Ingress: Envoy AI Gateway
  # ----------------------------------------------------------------------------
  envoy:
    image: envoyproxy/envoy:v1.31.2
    container_name: aiorche-envoy
    restart: always
    networks:
      - aiorche-net
    volumes:
      - ./deploy/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro,z
    ports:
      - "${ENVOY_TRAFFIC_PORT:-8080}:8080" # L7 Traffic Ingress
      - "${ENVOY_ADMIN_PORT:-9901}:9901"   # Envoy Admin & Prometheus Stats
    command: ["/usr/local/bin/envoy", "-c", "/etc/envoy/envoy.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9901/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 4. Control Plane: FastAPI Backend
  # ----------------------------------------------------------------------------
  backend:
    image: aiorche-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aiorche-backend
    restart: always
    networks:
      - aiorche-net
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aiorche_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENVOY_ADMIN_URL: http://envoy:9901
      DATACENTER_NAME: ${DATACENTER_NAME:-온프레미스 주전산센터}
      CLUSTER_REGION: ${CLUSTER_REGION:-DC-1 서울}
      DEPLOY_MODE: standalone
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data/logs:/app/logs:z
      - ./data/worm_audit:/app/worm_audit:z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 5. Admin Console: React 18 + Vite Nginx Frontend
  # ----------------------------------------------------------------------------
  frontend:
    image: aiorche-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aiorche-frontend
    restart: always
    networks:
      - aiorche-net
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

