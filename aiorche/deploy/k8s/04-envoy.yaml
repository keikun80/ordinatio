apiVersion: v1
kind: ConfigMap
metadata:
  name: envoy-config
  namespace: aiorche
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: ai_gateway_ingress
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 8080
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: ai_ingress
              route_config:
                name: local_ai_route
                virtual_hosts:
                - name: ai_service
                  domains: ["*"]
                  routes:
                  - match:
                      prefix: "/health"
                    route:
                      cluster: backend_service
                  - match:
                      prefix: "/api"
                    route:
                      cluster: backend_service
                  - match:
                      prefix: "/v1/chat/completions"
                    route:
                      cluster: vllm_inference_pool
                      timeout: 60s
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
      - name: backend_service
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: backend_service
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: backend
                    port_value: 8000

      - name: vllm_inference_pool
        type: STRICT_DNS
        lb_policy: LEAST_REQUEST
        load_assignment:
          cluster_name: vllm_inference_pool
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: 127.0.0.1
                    port_value: 8000

    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: envoy
  namespace: aiorche
  labels:
    app: envoy
    app.kubernetes.io/part-of: aiorche
spec:
  replicas: 1
  selector:
    matchLabels:
      app: envoy
  template:
    metadata:
      labels:
        app: envoy
    spec:
      containers:
      - name: envoy
        image: envoyproxy/envoy:v1.31.2
        imagePullPolicy: IfNotPresent
        command:
        - /usr/local/bin/envoy
        - -c
        - /etc/envoy/envoy.yaml
        ports:
        - containerPort: 8080
          name: ingress
        - containerPort: 9901
          name: admin
        volumeMounts:
        - name: envoy-config-vol
          mountPath: /etc/envoy
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
      volumes:
      - name: envoy-config-vol
        configMap:
          name: envoy-config
---
apiVersion: v1
kind: Service
metadata:
  name: envoy
  namespace: aiorche
  labels:
    app: envoy
spec:
  type: NodePort
  selector:
    app: envoy
  ports:
  - port: 8080
    targetPort: 8080
    nodePort: 30088
    name: ingress
  - port: 9901
    targetPort: 9901
    nodePort: 30901
    name: admin
