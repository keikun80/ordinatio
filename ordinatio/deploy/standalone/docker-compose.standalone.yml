# ==============================================================================
# Ordinatio Standalone Mode Docker Compose Specification
# Single-Host Self-Contained Appliance Architecture (Enterprise Linux 9)
# ==============================================================================

networks:
  ordinatio-net:
    name: ordinatio-net
    driver: bridge

services:
  # ----------------------------------------------------------------------------
  # 1. Metastore: PostgreSQL 15
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: ordinatio-postgres
    restart: always
    networks:
      - ordinatio-net
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ordinatio_db}
    ports:
      # 로컬 루프백 전용 바인딩 (외부 노출 차단)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
      - ./data/postgres:/var/lib/postgresql/data:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ordinatio_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Quota & Distributed Cache: Redis 7
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ordinatio-redis
    restart: always
    networks:
      - ordinatio-net
    ports:
      # 로컬 루프백 전용 바인딩 (외부 노출 차단)
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - ./data/redis:/data:z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 3. L7 Ingress: Envoy AI Gateway
  # ----------------------------------------------------------------------------
  envoy:
    image: envoyproxy/envoy:v1.31.2
    container_name: ordinatio-envoy
    restart: always
    user: "0:0"
    networks:
      - ordinatio-net
    volumes:
      - ./deploy/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro,z
    ports:
      - "${ENVOY_TRAFFIC_PORT:-8080}:8080" # L7 Traffic Ingress
      - "${ENVOY_ADMIN_PORT:-9901}:9901"   # Envoy Admin & Prometheus Stats
    command: ["/usr/local/bin/envoy", "-c", "/etc/envoy/envoy.yaml"]
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/bash -c 'exec 3<>/dev/tcp/127.0.0.1/9901 && printf \"GET /ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q \"LIVE\" <&3' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 4. Control Plane: FastAPI Backend
  # ----------------------------------------------------------------------------
  backend:
    image: ${BACKEND_IMAGE:-keikun808/ordinatio-backend:v1.0.2}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ordinatio-backend
    restart: always
    networks:
      - ordinatio-net
    env_file:
      - .env
    dns:
      - ${DNS_SERVER:-8.8.8.8}
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ordinatio_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ENVOY_ADMIN_URL: http://envoy:9901
      DATACENTER_NAME: ${DATACENTER_NAME:-온프레미스 주전산센터}
      CLUSTER_REGION: ${CLUSTER_REGION:-DC-1 서울}
      DEPLOY_MODE: standalone
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data/logs:/app/logs:z
      - ./data/worm_audit:/app/worm_audit:z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/health || curl -sf http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 5. Admin Console: React 18 + Vite Nginx Frontend
  # ----------------------------------------------------------------------------
  frontend:
    image: ${FRONTEND_IMAGE:-keikun808/ordinatio-frontend:v1.0.2}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ordinatio-frontend
    restart: always
    networks:
      - ordinatio-net
    env_file:
      - .env
    volumes:
      - ./deploy/frontend/default.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ./frontend/dist:/usr/share/nginx/html:ro,z
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5173/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

