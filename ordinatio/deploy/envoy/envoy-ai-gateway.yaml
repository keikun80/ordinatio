# Envoy AI Gateway L7 Configuration (ext_proc & LLM Protocol Native)
# Phase 0.1 Air-Gapped High Performance AI Gateway Architecture

static_resources:
  listeners:
  - name: ai_gateway_ingress
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8080
    filter_chains:
    - filters:
      - name: envoy.filters.network.http_connection_manager
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
          stat_prefix: envoy_ai_gateway
          stream_idle_timeout: 300s
          route_config:
            name: ai_gateway_routes
            virtual_hosts:
            - name: ai_services
              domains: ["*"]
              routes:
              - match:
                  prefix: "/health"
                route:
                  cluster: backend_service
                  timeout: 5s

              # AgentRouter Native Dispatch Endpoint
              - match:
                  prefix: "/v1/chat/completions"
                route:
                  cluster: backend_service
                  timeout: 180s
                  retry_policy:
                    retry_on: "5xx,connect-failure,reset"
                    num_retries: 2
                    retry_back_off:
                      base_interval: 0.2s
                      max_interval: 1s

              - match:
                  prefix: "/v1/models"
                route:
                  cluster: backend_service
                  timeout: 15s

              - match:
                  prefix: "/v1/routes"
                route:
                  cluster: backend_service
                  timeout: 60s

              - match:
                  prefix: "/api/v1/agent-router"
                route:
                  cluster: backend_service
                  timeout: 30s

              - match:
                  prefix: "/api/v1/ext-proc"
                route:
                  cluster: backend_service
                  timeout: 10s

          http_filters:
          # Envoy AI Gateway HTTP Filters
          #
          # [보안 전제 / ADR-17] ext_proc 필터는 의도적으로 비활성 상태입니다.
          # PII 마스킹과 WORM 감사는 Python 제어 평면 게이트웨이
          # (backend_service -> dispatch_chat_completion)에 통합되어 있으며,
          # Envoy는 평문 router 필터로 모든 트래픽을 그곳으로 전달합니다.
          # 따라서 모델에 도달하는 모든 요청은 마스킹을 거칩니다.
          #
          # !! 아래 ext_proc 필터를 활성화하면 추론 트래픽이 제어 평면 가드레일을
          #    우회할 수 있습니다. 활성화 시에는 app/core/ext_proc_server.py에
          #    PII 마스킹(mask_conversation) + BLOCK REJECT + 감사 기록을
          #    반드시 먼저 구현해야 합니다.
          # - name: envoy.filters.http.ext_proc
          #   typed_config:
          #     "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
          #     grpc_service:
          #       envoy_grpc:
          #         cluster_name: agent_router_ext_proc
          - name: envoy.filters.http.router
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
  # Backend Orchestrator & AgentRouter Control Plane
  - name: backend_service
    type: STRICT_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    connect_timeout: 5s
    load_assignment:
      cluster_name: backend_service
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: backend
                port_value: 8000

  # Fast Tier Model Cluster (e.g. 8B parameter models for light intent / high speed)
  - name: vllm_fast_8b
    type: STRICT_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: LEAST_REQUEST
    connect_timeout: 5s
    load_assignment:
      cluster_name: vllm_fast_8b
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: backend
                port_value: 8000

  # Reasoning Tier Model Cluster (e.g. 70B/72B/R1 models for complex coding & math)
  - name: vllm_reasoning_72b
    type: STRICT_DNS
    dns_lookup_family: V4_ONLY
    lb_policy: LEAST_REQUEST
    connect_timeout: 10s
    load_assignment:
      cluster_name: vllm_reasoning_72b
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: backend
                port_value: 8000

  # General vLLM Inference Pool (legacy fallback)
  - name: vllm_inference_pool
    type: STRICT_DNS
    lb_policy: LEAST_REQUEST
    connect_timeout: 5s
    load_assignment:
      cluster_name: vllm_inference_pool
      endpoints:
      - lb_endpoints:
        - endpoint:
            address:
              socket_address:
                address: backend
                port_value: 8000

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
